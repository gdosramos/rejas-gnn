# Conda environment for rejas-gnn. Exact package versions live in requirements-lock.txt
# (the reference run); this file only provides Python and pip.
#   conda env create -f environment.yml && conda activate rejas-gnn
#   python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
#   python -m pip install -r requirements-lock.txt && python -m pip install -e ".[dev]" --no-deps
name: rejas-gnn
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
