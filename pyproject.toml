[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rejas-gnn"
version = "0.1.0"
description = "Graph Neural Networks for residential street-closure (rejas) prediction in Pedro Aguirre Cerda, Santiago de Chile"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rejas-GNN contributors" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "networkx>=3.1",
    "pyproj>=3.5",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "matplotlib>=3.8",
    "torch>=2.1",
    "torch_geometric>=2.4",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8", "jupyterlab"]

[project.scripts]
rejas-gnn = "rejas_gnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
