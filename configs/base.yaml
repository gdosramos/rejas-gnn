name: sage_line_pac
results_dir: results
data:
  raw_edges_csv: data/raw/pac.csv
  covariates_csv: data/external/aristas_PAC_consolidado.csv
  covariate_prefixes:
  - cpv24_
  - uai_
  positive_states:
  - cierre
  - informal
  - medio
  drop_condominio: false
  crs_metric: EPSG:32719
  crs_geographic: EPSG:4326
graph:
  type: line
  radius_m: 150.0
  max_neighbors: 32
split:
  n_blocks: 20
  n_folds: 5
  buffer_m: 200.0
  val_fraction_of_blocks: 0.25
model:
  name: sage
  hidden_dim: 64
  num_layers: 2
  dropout: 0.3
  heads: 4
  aggr: mean
train:
  epochs: 300
  lr: 0.005
  weight_decay: 0.0005
  patience: 40
  pos_weight: balanced
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  device: cpu
  min_epochs: 30
